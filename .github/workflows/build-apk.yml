# Builds the "full" flavor release APKs exactly like the README describes:
#   1. python tool/bundle_runtime.py      -> native runtime in jniLibs/
#   2. cd agent && npm ci && node build.mjs -> assets/agent.zip
#   3. flutter build apk --flavor full --release --split-per-abi
# The three APKs (armeabi-v7a, arm64-v8a, x86_64) are uploaded as a build
# artifact; most phones need the arm64-v8a one.
#
# Signing: without android/key.properties the release build falls back to the
# debug key (see android/app/build.gradle.kts). The APKs install fine via
# sideloading, but cannot be published to the Play Store or update a
# Play Store install.

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bundle native runtime (jniLibs)
        run: |
          pip install lief
          python tool/bundle_runtime.py

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build agent host (agent.zip)
        run: |
          cd agent
          npm ci
          node build.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/andropi-release.p12"
          cat > "$GITHUB_WORKSPACE/android/key.properties" << EOF
          storeFile=$GITHUB_WORKSPACE/android/andropi-release.p12
          storePassword=andropi-release-2026
          keyAlias=andropi
          keyPassword=andropi-release-2026
          EOF

      - name: Build APKs (flavor full, split per ABI)
        run: |
          flutter pub get
          flutter build apk --flavor full --release --split-per-abi --target-platform android-arm,android-arm64,android-x64

      - name: Print APK signer certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-full-release.apk | grep -i "SHA-256" || true
          else
            echo "apksigner not found; skipping"
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: andropi-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
